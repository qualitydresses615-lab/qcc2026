<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something's Coming — Quality Dresses</title>
<meta name="description" content="Quality Dresses is preparing something new. Follow along to be the first to know.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0A0A0B;
  --ink:#111114;
  --gold:#D4AF37;
  --gold-soft:#F3D67A;
  --white:#F6F4EF;
  --muted:#9C9488;
  --line:rgba(255,255,255,.09);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:radial-gradient(ellipse at top,rgba(212,175,55,.1),transparent 60%),var(--black);
  color:var(--white);font-family:'Inter',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.logo{width:min(280px,60vw);margin-bottom:44px;opacity:0;animation:fadeUp 1s var(--ease) forwards}
.eyebrow{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:20px;
  opacity:0;animation:fadeUp 1s var(--ease) .15s forwards}
h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(2rem,7vw,3.6rem);line-height:1.1;max-width:16ch;margin-bottom:22px;
  opacity:0;animation:fadeUp 1s var(--ease) .3s forwards}
.grad-word{background:linear-gradient(90deg,var(--gold),var(--gold-soft));-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{color:var(--muted);font-size:1.05rem;max-width:42ch;margin-bottom:40px;
  opacity:0;animation:fadeUp 1s var(--ease) .45s forwards}
.dots{display:flex;gap:8px;margin-bottom:40px;opacity:0;animation:fadeUp 1s var(--ease) .6s forwards}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 1.6s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
.links{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;
  opacity:0;animation:fadeUp 1s var(--ease) .75s forwards}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:100px;font-weight:600;font-size:.9rem;
  border:1px solid var(--line);color:var(--white);text-decoration:none;transition:.3s var(--ease)}
.btn:hover{border-color:var(--gold);transform:translateY(-2px)}
.btn.gold{background:linear-gradient(90deg,var(--gold),var(--gold-soft));color:var(--black);border:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
footer{position:absolute;bottom:24px;font-size:.75rem;color:var(--muted);opacity:0;animation:fadeUp 1s var(--ease) .9s forwards}
</style>
</head>
